name: 🛡️ Neue Mission für die Ehrengarde
description: Eine neue Mission für den Grossen Zwerg und Füürio (Kapitel 6).
title: "Mission: "
labels: [idee, mission]
body:
  - type: textarea
    id: problem
    attributes:
      label: Was ist passiert? Wer braucht Hilfe?
      placeholder: z. B. "Ein Sturm hat die Mühle kaputt gemacht. Müller Hugo kann kein Mehl mehr mahlen."
    validations:
      required: true
  - type: textarea
    id: aufgabe
    attributes:
      label: Was müssen die zwei tun? (ohne Kampf)
      placeholder: z. B. "3 Bretter und 2 Steine bringen, Füürio dreht mit seinem Atem das Mühlrad an"
  - type: dropdown
    id: belohnung
    attributes:
      label: Belohnung
      options: [Ausbau vom Zuhause, Neue Kleider für den Grossen Zwerg, Etwas für Füürio, Egal / Überraschung]
  - type: markdown
    attributes:
      value: "Wie eine Mission gebaut wird, steht im Wiki unter **Neues Level bauen** (Abschnitt «Neue Mission»). Mit **@claude** im Text baut Claude die Mission ein."
