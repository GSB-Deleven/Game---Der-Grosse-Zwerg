name: Wiki aktualisieren

# Überträgt die Seiten aus docs/wiki (und die Level-Anleitung) ins GitHub-Wiki.
# Voraussetzung: Im Wiki wurde einmal von Hand eine erste Seite angelegt.
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', 'docs/NEUES-LEVEL.md', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wiki holen, Seiten kopieren, hochladen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          cp docs/wiki/*.md wiki/
          cp docs/NEUES-LEVEL.md wiki/Neues-Level-bauen.md
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "Wiki aus docs/wiki aktualisiert (${GITHUB_SHA::7})"
          git push
